<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hat Tip — Page not found</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #2853fb;
      --color-primary-hover: #1a3fd4;
      --color-canvas: #f8f6ed;
      --color-text: #1a1a1a;
      --color-text-secondary: #5a5a52;
      --color-border-light: #eceadf;
      --nav-height: 72px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--color-text);
      background-color: var(--color-canvas);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    .container { width: 100%; max-width: 1160px; margin: 0 auto; padding: 0 clamp(1.25rem, 3vw, 2.5rem); }
    .nav { height: var(--nav-height); border-bottom: 1px solid var(--color-border-light); display: flex; align-items: center; }
    .nav-brand { font-family: 'Instrument Serif', serif; font-size: 1.5rem; letter-spacing: -0.02em; }
    main { flex: 1; display: flex; align-items: center; text-align: center; padding: 4rem 0; }
    .eyebrow { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 1.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(2.5rem, 5vw + 1rem, 4.5rem); line-height: 1.05; letter-spacing: -0.02em; margin-bottom: 1.5rem; }
    h1 .accent { color: var(--color-primary); font-style: italic; }
    p { color: var(--color-text-secondary); font-size: 1.125rem; max-width: 34rem; margin: 0 auto 2.5rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.9rem 1.75rem; border-radius: 100px; font-weight: 600; font-size: 1rem;
      background: var(--color-primary); color: #fff; transition: background 0.2s, transform 0.2s;
    }
    .btn:hover { background: var(--color-primary-hover); transform: translateY(-2px); }
    :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; }
  </style>
</head>
<body>
  <nav class="nav" aria-label="Main navigation">
    <div class="container"><a href="/" class="nav-brand">Hat Tip</a></div>
  </nav>
  <main>
    <div class="container">
      <p class="eyebrow">404</p>
      <h1>This page has <span class="accent">moved on</span></h1>
      <p>The link you followed doesn't point to anything here anymore. Head back to the homepage or browse the case studies.</p>
      <a href="/" class="btn">Back to Hat Tip</a>
    </div>
  </main>
</body>
</html>
